[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-rag-router"
version = "0.1.0"
description = "Production Adaptive & Speculative RAG Framework for Autonomous Agents: Dynamic Multi-Strategy Routing, Query Decomposition, Hallucination Verification, and Speculative Drafting."
readme = "README.md"
authors = [
  { name = "nhminhhh", email = "nhatminhn649@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.5.0",
  "typing-extensions>=4.8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
  "pytest-asyncio>=0.21.0",
]

[project.scripts]
rag-router = "rag_router.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
